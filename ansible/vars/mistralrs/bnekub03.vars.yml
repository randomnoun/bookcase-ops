kube_context_mistralrs: "bnekub03"
kube_storageclass_mistralrs: "bnenod05-local-path"

mistralrs_volume_size_gb: 300

# The role default is the moving 'latest' tag. Once a release has been run on the node, pin it ( or its digest ) here.
# mistralrs_image: "ghcr.io/ericlbuehler/mistral.rs:cuda128-sm86-X.Y.Z"

mistralrs_hf_token: "{{ lookup('hashi_vault', 'mount_point=secret secret=secret/data/k8s/bnekub03/secret/dev-mistralrs/mistralrs:hf_token')}}"

# One model per deployment. Which model, its quantization and flags, and its litellm settings are in
# bnekub03-models.vars.yml ( listed after this file in k8s_llm_bnekub03.yml ); `python bin/llm.py model load NAME` switches it.
