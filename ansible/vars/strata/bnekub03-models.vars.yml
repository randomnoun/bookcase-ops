# The models strata can serve, and which one it does serve.
#
# Plain YAML only ( no jinja ): bin/llm.py reads this file directly. The strata role copies the active entry
# onto the flat strata_* variables ( strata_family, strata_model ... ), so anything an entry leaves out falls back
# to the role defaults / bnekub03.vars.yml.
#
# Switch with `python bin/llm.py model load NAME`, which rewrites strata_active_model below, re-runs the role and
# updates the litellm entry. Or edit it by hand and re-run the role.
#
# Strata is built around one model, Qwen3.8-Flash-Next ( 125B parameters, a mixture of experts ), and runs it from GGUF files by keeping the experts in RAM
# and the dense layers and the hottest experts on the GPUs, so it is not the same model as the 27B the other engines serve and the speeds
# aren't comparable. Sizes, RAM needs and providers are in https://github.com/Niko1221/Strata/blob/main/docs/MODELS.md. bnenod05 has about 94GB of
# RAM and 2 x 24GB of VRAM; the "RAM for the experts + about 10GB" rule in those docs leaves room for every ISTA-DASLab size.
# Once it is scaled up, `kubectl -n dev-strata exec deploy/strata -- strata launch --plan --family qwen --model IQ3_XXS --context 128k`
# prints what a choice would download, where the model goes and whether it fits ( it needs a running pod, so there is no way to ask before the first start ).

strata_active_model: "flash-next-q2-0"

strata_models:

  # ISTA-DASLab's original IQ3_XXS pack: 47GB of RAM + VRAM for the model ( experts in shard 1: 43GB ), 66-76GB to download. Listed as "great"
  # quality, one step below IQ3_S, "best; matches the full model on the published tests", and one above IQ2_XS.
  flash-next-iq3-xxs:
    family: "qwen"
    model: "IQ3_XXS"

    # 256k, the model's native maximum ( 2026-11-15 ). It started in 2 minutes, `/health` says max_context 262144, and a 252k-token filler prompt was
    # answered correctly with no restart ( setup/SETUP-LLM-BE-STRATA.md ). Both GPUs sit at about 96% memory with the model idle and Strata's docs
    # say 262K for IQ3_XXS is "not measured", so if a long prompt or a long reply restarts the pod, add `kv: "k8v4"` below ( keys at 8 bits and
    # values as rotated 4-bit: 23% less KV memory, prompts 2-5% slower ), and after that go back to 192k. Keep num_ctx below equal to this.
    context: "256k"

    # drafting: auto ( DFlash2 where Strata has it, which is the default ), mtp, dflash2 or off. In a pi session DFlash2 was no faster than MTP ( median 151.6 tok/sec against
    # 149.8, slower on 1,000+ token replies ) and it answers one request at a time, so this asks for MTP. `set: ["drafting=mtp"]` does NOT work: the engine said
    # `unknown argument: --drafting` and the pod crash-looped ( tried 2026-11-15 ), so the role patches the image's entrypoint to pass `--drafting` ( see strata_drafting in the role defaults ).
    # The choice is saved in the launch preset: to go back, set "auto" here rather than deleting the line. Running with it ( 2026-11-15 ): the engine log says `strata mtp: draft layer loaded`.
    drafting: "mtp"

    # The litellm model that `llm.py model sync` creates for this entry.
    litellm:
      public_name: "strata-qwen3.8-flash-next:iq3_xxs"
      # Strata serves any model name it is sent, and lists the loaded one at /v1/models ( `engine list` shows it ): the name is only a label.
      upstream: "strata"
      # litellm_params, merged over model / api_base / api_key:
      #
      #   num_ctx: only used so pi / opencode learn the context window. Run `pi-sync-models` after changing it
      #       ( and restart opencode ). Strata itself ignores it. Keep it equal to the context the server starts with.
      #
      #   extra_body.reasoning_budget_tokens: Strata's thinking cap. Its docs list it as a server-side config key and say a request's own value wins;
      #       I haven't found a way to set it server-wide in the Docker image ( its environment variables don't include it ), so it is sent with every
      #       request instead, as the tabbyapi entry does. Without a cap Strata's `answer_room` ( on by default ) wraps up the thinking of a request
      #       with max_tokens of 1024 or more when a quarter of the cap is left. The name has "tokens" in plural so litellm doesn't mask it in /model/info.
      #
      #   reasoning_effort: left unset. The model's template defaults to thinking on at xhigh, which is what the other engines set.
      params:
        num_ctx: 262144
        extra_body:
          reasoning_budget_tokens: 8192

  # The smallest and fastest ISTA-DASLab size: 37.6GB of RAM + VRAM ( experts in shard 1: 34GB ), "good" quality.
  flash-next-q2-0:
    family: "qwen"
    model: "Q2_0"
    # 256k like the IQ3_XXS entry. Started at this size ( 2026-11-15 ): `/health` says max_context 262144, a 45-request pi session ( prompts up to 63k tokens ) ran at a
    # median 166 tok/sec with no restart, and a 249k-token test prompt ( bin/llm_util.py longprompt ) was answered correctly. Downloaded in 13 minutes ( its second shard is shared with IQ3_XXS ).
    # This entry sets no `drafting`: it gets the role default, `strata_drafting: "mtp"` ( it ran MTP before only because it inherited it from the saved preset ).
    context: "256k"
    # No `set`: the `ple-io=direct` trial on this entry ( 2026-11-15 ) is over. Q2_0 fits with the PLE table locked in RAM and ran 166.2 tok/sec in a pi session that way, so there is no reason to
    # read it from disk. The role now writes STRATA_SET empty when an entry has none, and an init container clears the saved preset at every start, so nothing is carried over from IQ3_S
    # ( setup/SETUP-LLM-BE-STRATA.md ). Not yet run on the cluster: after the first `model load flash-next-q2-0`, check the log says `PLE table locked in RAM` and not `PLE direct read probe`.
    litellm:
      public_name: "strata-qwen3.8-flash-next:q2_0"
      upstream: "strata"
      params:
        num_ctx: 262144
        extra_body:
          reasoning_budget_tokens: 8192

  # The largest: 54.8GB of RAM + VRAM ( experts in shard 1: 50GB ), the slowest, and the one the docs say matches the full model on their tests.
  flash-next-iq3-s:
    family: "qwen"
    model: "IQ3_S"
    # STARTS ONLY WITH `ple-io=direct` ( 2026-11-15; Ready in 2 min, answered 8k/189k/249k-token prompts, no restart ). WITHOUT it the node's OOM killer killed the engine about 70 seconds into every load ( pod OOMKilled, exit 137, six restarts ). The log's plan was a 46.8 GiB
    # expert arena plus the 26.8 GiB PLE table locked in RAM, 78% of the 94.2 GiB the engine saw, against 71% for IQ3_XXS which fits. Context isn't the cause ( pinned KV is 1.55 GiB at 256k ).
    # To try, in order, on Q2_0 first so a bad flag doesn't crash-loop this: `set: ["ple-io=direct"]` ( the PLE table read from SSD instead of locked in RAM, gives back 26.8 GiB, costs speed ),
    # then `set: ["ram-keep-gib=12"]`. See setup/SETUP-LLM-BE-STRATA.md. The files are on the volume ( download 19 min 39 s, 46.5 MB/s ), so a retry costs only the load.
    # `ple-io=direct` is set below and is what lets it start ( it gave back 27.9 GiB on Q2_0; with IQ3_S loaded and used, `free` showed about 20 GiB available ). The failed starts took the node's kubelet down twice ( NotReady, langfuse and opencode stuck ), so if this
    # OOMs again, scale strata to 0 before the node does that: `kubectl -n dev-strata scale deploy/strata --replicas=0`.
    context: "256k"
    set:
      - "ple-io=direct"
    litellm:
      public_name: "strata-qwen3.8-flash-next:iq3_s"
      upstream: "strata"
      params:
        num_ctx: 262144
        extra_body:
          reasoning_budget_tokens: 8192

  # NOT TRIED. Unsloth's UD-IQ4_XS of the same Flash-Next model ( family "unsloth" in Strata ): 94 GB to download, about 72 GB of RAM for the experts by Strata's docs, 88.9% same top token
  # as Q8_0 ( ISTA-DASLab's IQ3_S: 87.7% ). Strata's docs list it as the Unsloth size that fits all experts in 94 GB, but that is more than IQ3_S needs and IQ3_S was OOM-killed on this node,
  # so expect the same unless the PLE table is moved out of RAM first ( see flash-next-iq3-s ); `set: ple-io=direct` below is that guess, untested. Disk: about 454 GB free before this download.
  # Whether its 28.8 GB second shard is shared with the ISTA-DASLab sizes ( as theirs are ) is not known: it is a different quant, so assume not.
  # Not active; load it with `llm.py model load flash-next-unsloth-ud-iq4-xs` once a model that needs this much RAM is known to fit.
  flash-next-unsloth-ud-iq4-xs:
    family: "unsloth"
    model: "UD-IQ4_XS"
    context: "128k"
    drafting: "mtp"
    set:
      - "ple-io=direct"
    litellm:
      public_name: "strata-qwen3.8-flash-next:unsloth-ud-iq4-xs"
      upstream: "strata"
      params:
        num_ctx: 131072
        extra_body:
          reasoning_budget_tokens: 8192
