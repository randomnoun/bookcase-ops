# needs the prometheus operator's ServiceMonitor CRD, so the prometheus role has to have been applied first.
# prometheus only picks this up because of the 'prometheus: default' label here and the 'prometheusEnabled'
# label on the namespace, see roles/prometheus/templates/03-prometheus-values.j2.yml

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: strata
  labels:
    prometheus: default
spec:
  selector:
    matchLabels:
      app: strata-web
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      # GET /metrics is JSON unless the request asks for text/plain or ?format=prometheus ( then it uses vLLM's metric names ); this asks both ways
      params:
        format: ["prometheus"]
      # /metrics needs the API key
      authorization:
        type: Bearer
        credentials:
          name: strata-api-key
          key: api_key
