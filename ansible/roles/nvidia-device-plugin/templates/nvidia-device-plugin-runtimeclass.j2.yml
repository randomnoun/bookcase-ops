# cluster-scoped - lets pods opt in to the "nvidia" containerd runtime
# (configured via `nvidia-ctk runtime configure --runtime=containerd` on
# the host - see setup/SETUP-PROXMOX.md) by setting runtimeClassName: nvidia.
# Needed by the nvidia-device-plugin pod itself (to load NVML/driver
# libraries from the host) as well as any GPU-requesting workload pod.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: "{{ nvidia_device_plugin_runtime_class_name }}"
handler: "{{ nvidia_device_plugin_runtime_class_name }}"
