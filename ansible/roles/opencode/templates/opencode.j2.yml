# k8s yaml for `opencode serve` (headless HTTP server) - see https://opencode.ai/docs/server/
#
# opencode has no database option - sessions/auth are files under $HOME -
# so this is backed by a PVC rather than postgres. The same PVC holds the
# repositories it works on (/data/workspace).
#
# Models come from litellm (same as open-webui). opencode needs every model
# listed in its config and can't discover them, so start.sh writes that list
# from litellm's /models endpoint into the global config file on each pod
# start. To pick up a model newly added to litellm:
#
#   kubectl -n dev-opencode rollout restart deploy/opencode

---
apiVersion: v1
kind: Secret
metadata:
  name: opencode-secrets
type: Opaque
stringData:
  LITELLM_API_KEY: "{{ opencode_litellm_api_key }}"
  OPENCODE_SERVER_PASSWORD: "{{ opencode_server_password }}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  start.sh: |
    #!/bin/sh
    set -e
    # the image is bare alpine: add git (opencode uses it for projects/snapshots), jq and curl (for the model sync below)
    apk add --no-cache git jq curl openssh-client > /dev/null
    mkdir -p "$HOME/.config/opencode" /data/workspace
    cfg="$HOME/.config/opencode/opencode.json"
    synced=0
    for i in $(seq 1 12); do
      if ids=$(curl -sf -H "Authorization: Bearer $LITELLM_API_KEY" "$LITELLM_BASE_URL/models" | jq -ec '[.data[].id] | sort') && [ "$ids" != "[]" ]; then
        jq -n --argjson ids "$ids" --arg base "$LITELLM_BASE_URL" --arg model "$DEFAULT_MODEL" '{
          "$schema": "https://opencode.ai/config.json",
          "model": ("litellm/" + $model),
          "provider": { "litellm": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "litellm",
            "options": { "baseURL": $base, "apiKey": "{env:LITELLM_API_KEY}" },
            "models": ($ids | map({ key: ., value: { name: . } }) | from_entries)
          } }
        }' > "$cfg.tmp"
        mv "$cfg.tmp" "$cfg"
        echo "opencode.json: $ids"
        synced=1
        break
      fi
      echo "litellm not ready (attempt $i), retrying in 5s"
      sleep 5
    done
    # keep whatever config is already on the PVC if litellm never answers
    [ "$synced" = 1 ] || echo "WARNING: could not fetch models from litellm; using the existing config, if any"
    cd /data/workspace
    exec opencode serve --hostname 0.0.0.0 --port 4096

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-pvc
spec:
  storageClassName: "{{ kube_storageclass_opencode }}"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ opencode_volume_size_gb }}Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
spec:
  replicas: 1
  # RWO volume + single instance - don't try to run old and new side by side
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode-web
  template:
    metadata:
      labels:
        app: opencode-web
    spec:
      dnsPolicy: ClusterFirst
      # the agent runs arbitrary shell commands; don't hand it a kubernetes API token too
      automountServiceAccountToken: false
      containers:
        - name: opencode
          image: "{{ opencode_image }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/opencode/start.sh"]
          ports:
            - containerPort: 4096
          env:
            # the web UI's "add project" picker starts in $HOME, so make that
            # the directory holding the repos (dotfolders for opencode's own
            # config/sessions end up alongside them)
            - name: HOME
              value: /data/workspace
            - name: LITELLM_BASE_URL
              value: "{{ opencode_litellm_base_url }}"
            - name: DEFAULT_MODEL
              value: "{{ opencode_default_model }}"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: LITELLM_API_KEY
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: OPENCODE_SERVER_PASSWORD
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "250m"
              memory: 1Gi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /etc/opencode
              name: config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencode-pvc
        - name: config
          configMap:
            name: opencode-config

---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: opencode-web
  ports:
    - protocol: TCP
      port: 4096
      targetPort: 4096
  type: LoadBalancer

---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: opencode-tls-secret
data:
  tls.crt: "{{ opencode_tls_secret_cert }}"
  tls.key: "{{ opencode_tls_secret_key }}"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-web-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.org/client-max-body-size: "0"
    # agent runs are long-lived and streamed (SSE / websockets)
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
    nginx.org/websocket-services: "web"
spec:
  tls:
    - hosts:
        - {{ opencode_ingress_host }}
      secretName: opencode-tls-secret
  rules:
  - host: {{ opencode_ingress_host }}
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: "web"
            port:
              number: 4096
