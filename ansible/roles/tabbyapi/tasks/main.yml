- name: "tabbyapi keys must be set"
  assert:
    that:
      - tabbyapi_api_key | length > 0
      - tabbyapi_admin_key | length > 0
    fail_msg: "set tabbyapi_api_key and tabbyapi_admin_key (see setup/SETUP-LLM-BACKEND.md)"

- name: "tabbyapi_active_model must be one of tabbyapi_models"
  assert:
    that: tabbyapi_active_model in tabbyapi_models
    fail_msg: "tabbyapi_active_model '{{ tabbyapi_active_model }}' is not in tabbyapi_models ( {{ tabbyapi_models.keys() | list }} )"
  when: tabbyapi_active_model | length > 0

- name: "use the active tabbyapi model"
  set_fact:
    tabbyapi_model_name: "{{ _tabbyapi_entry.folder }}"
    tabbyapi_max_seq_len: "{{ _tabbyapi_entry.max_seq_len | default(tabbyapi_max_seq_len) }}"
    tabbyapi_cache_mode: "{{ _tabbyapi_entry.cache_mode | default(tabbyapi_cache_mode) }}"
    tabbyapi_tensor_parallel: "{{ _tabbyapi_entry.tensor_parallel | default(tabbyapi_tensor_parallel) }}"
    tabbyapi_draft_mode: "{{ _tabbyapi_entry.draft_mode | default(tabbyapi_draft_mode) }}"
    tabbyapi_draft_num_tokens: "{{ _tabbyapi_entry.draft_num_tokens | default(tabbyapi_draft_num_tokens) }}"
    tabbyapi_dynamic_draft: "{{ _tabbyapi_entry.dynamic_draft | default(tabbyapi_dynamic_draft) }}"
  vars:
    _tabbyapi_entry: "{{ tabbyapi_models[tabbyapi_active_model] }}"
  when: tabbyapi_active_model | length > 0

- name: "kubernetes namespace tabbyapi"
  k8s:
    state: "present"
    context: "{{ kube_context_tabbyapi }}"
    wait: true
    definition: "{{ lookup('template', 'tabbyapi-namespace.j2.yml')  }}"

- name: "look up current tabbyapi replicas"
  k8s_info:
    context: "{{ kube_context_tabbyapi }}"
    api_version: apps/v1
    kind: Deployment
    name: tabbyapi
    namespace: "{{ kube_namespace_tabbyapi }}"
  register: _tabbyapi_existing

- name: "work out tabbyapi replicas"
  set_fact:
    tabbyapi_replicas: "{{ _tabbyapi_existing.resources[0].spec.replicas if (_tabbyapi_existing.resources | length > 0) else tabbyapi_initial_replicas }}"

- name: "kubernetes deployment tabbyapi"
  k8s:
    state: "present"
    context: "{{ kube_context_tabbyapi }}"
    namespace: "{{ kube_namespace_tabbyapi }}"
    # nothing to wait for when scaled to 0
    wait: "{{ tabbyapi_replicas | int > 0 }}"
    # loading a model onto the GPUs can take minutes
    wait_timeout: 900
    definition: "{{ lookup('template', 'tabbyapi.j2.yml')  }}"
