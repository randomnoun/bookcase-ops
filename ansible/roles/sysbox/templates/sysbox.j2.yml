# based on https://github.com/nestybox/sysbox/blob/v0.7.1/sysbox-k8s-manifests/sysbox-install.yaml
# sysbox lets a pod run dockerd ( and so containers of its own ) without privileged: true; pods opt in with runtimeClassName: sysbox-runc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sysbox-label-node
  namespace: kube-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sysbox-node-labeler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sysbox-label-node-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sysbox-node-labeler
subjects:
  - kind: ServiceAccount
    name: sysbox-label-node
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sysbox-operational-attributes
  namespace: kube-system
data:
  SYSBOX_MGR_CONFIG: ""
  SYSBOX_FS_CONFIG: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sysbox-containerd-dropin
  namespace: kube-system
data:
  sysbox.toml: |
    [plugins.'io.containerd.cri.v1.runtime']
      enable_unprivileged_ports = false
      enable_unprivileged_icmp = false

    [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.sysbox-runc]
      runtime_type = 'io.containerd.runc.v2'
      [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.sysbox-runc.options]
        BinaryName = '/usr/bin/sysbox-runc'
        SystemdCgroup = true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysbox-deploy-k8s
  namespace: kube-system
spec:
  selector:
    matchLabels:
      sysbox-install: "yes"
  template:
    metadata:
      labels:
        sysbox-install: "yes"
    spec:
      serviceAccountName: sysbox-label-node
      nodeSelector:
        sysbox-install: "yes"
      tolerations:
        - key: "sysbox-runtime"
          operator: "Equal"
          value: "not-running"
          effect: "NoSchedule"
      # containerd 2.x ( config version 3 ): the installer registers sysbox-runc where containerd doesn't look ( nestybox/sysbox#997 ), and
      # containerd's unprivileged port/icmp sysctls stop sysbox pods starting ( #1025 ). This writes the fix as a conf.d drop-in
      # before the installer restarts containerd. Both sysctls end up off for every pod on the node, sysbox or not.
      initContainers:
        - name: containerd-dropin
          image: "registry.nestybox.com/nestybox/sysbox-deploy-k8s:{{ sysbox_deploy_image_tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -e
              if ! grep -qE '^imports.*conf\.d' /mnt/host/etc/containerd/config.toml; then
                echo "/etc/containerd/config.toml doesn't import conf.d/*.toml, so containerd would ignore the sysbox drop-in" >&2
                exit 1
              fi
              mkdir -p /mnt/host/etc/containerd/conf.d
              cp /dropin/sysbox.toml /mnt/host/etc/containerd/conf.d/sysbox.toml
          volumeMounts:
            - name: host-etc
              mountPath: /mnt/host/etc
            - name: containerd-dropin
              mountPath: /dropin
      containers:
        - name: sysbox-deploy-k8s
          image: "registry.nestybox.com/nestybox/sysbox-deploy-k8s:{{ sysbox_deploy_image_tag }}"
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/opt/sysbox/scripts/sysbox-deploy-k8s.sh ce install"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SYSBOX_MGR_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: sysbox-operational-attributes
                  key: SYSBOX_MGR_CONFIG
            - name: SYSBOX_FS_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: sysbox-operational-attributes
                  key: SYSBOX_FS_CONFIG
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-etc
              mountPath: /mnt/host/etc
            - name: host-osrelease
              mountPath: /mnt/host/os-release
            - name: host-dbus
              mountPath: /var/run/dbus
            - name: host-run-systemd
              mountPath: /run/systemd
            - name: host-lib-systemd
              mountPath: /mnt/host/lib/systemd/system
            - name: host-etc-systemd
              mountPath: /mnt/host/etc/systemd/system
            - name: host-lib-sysctl
              mountPath: /mnt/host/lib/sysctl.d
            - name: host-opt-lib-sysctl
              mountPath: /mnt/host/opt/lib/sysctl.d
            - name: host-usr-bin
              mountPath: /mnt/host/usr/bin
            - name: host-opt-bin
              mountPath: /mnt/host/opt/bin
            - name: host-usr-local-bin
              mountPath: /mnt/host/usr/local/bin
            - name: host-opt-local-bin
              mountPath: /mnt/host/opt/local/bin
            - name: host-usr-lib-mod-load
              mountPath: /mnt/host/usr/lib/modules-load.d
            - name: host-opt-lib-mod-load
              mountPath: /mnt/host/opt/lib/modules-load.d
            - name: host-run
              mountPath: /mnt/host/run
            - name: host-var-lib
              mountPath: /mnt/host/var/lib
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-osrelease
          hostPath:
            path: /etc/os-release
        - name: host-dbus
          hostPath:
            path: /var/run/dbus
        - name: host-run-systemd
          hostPath:
            path: /run/systemd
        - name: host-lib-systemd
          hostPath:
            path: /lib/systemd/system
        - name: host-etc-systemd
          hostPath:
            path: /etc/systemd/system
        - name: host-lib-sysctl
          hostPath:
            path: /lib/sysctl.d
        - name: host-opt-lib-sysctl
          hostPath:
            path: /opt/lib/sysctl.d
        - name: host-usr-bin
          hostPath:
            path: /usr/bin/
        - name: host-opt-bin
          hostPath:
            path: /opt/bin/
        - name: host-usr-local-bin
          hostPath:
            path: /usr/local/bin/
        - name: host-opt-local-bin
          hostPath:
            path: /opt/local/bin/
        - name: host-usr-lib-mod-load
          hostPath:
            path: /usr/lib/modules-load.d
        - name: host-opt-lib-mod-load
          hostPath:
            path: /opt/lib/modules-load.d
        - name: host-run
          hostPath:
            path: /run
        - name: host-var-lib
          hostPath:
            path: /var/lib
        - name: containerd-dropin
          configMap:
            name: sysbox-containerd-dropin
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
# cluster-scoped. Only schedules pods onto nodes where the installer has finished ( it sets sysbox-runtime=running )
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysbox-runc
handler: sysbox-runc
scheduling:
  nodeSelector:
    sysbox-runtime: running
