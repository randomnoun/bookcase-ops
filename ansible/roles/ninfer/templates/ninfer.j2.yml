# k8s yaml for the image published by https://github.com/iamwavecut/ninfer-all ( ghcr.io/iamwavecut/ninfer-all )

---
# run.sh ( the launcher ) has no setting for --api-key, --model-id or --default-thinking-budget, and passes no extra
# arguments to the server, so NINFER_SERVER points at this wrapper, which adds them from the environment and then
# runs the real binary. The launcher's step-down on out-of-memory still works because it only sees the server's output.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ninfer-serve-wrapper
data:
  serve.sh: |
    #!/bin/sh
    [ -z "${NINFER_MODEL_ID:-}" ] || set -- "$@" --model-id "$NINFER_MODEL_ID"
    [ -z "${NINFER_API_KEY:-}" ] || set -- "$@" --api-key "$NINFER_API_KEY"
    [ -z "${NINFER_DEFAULT_THINKING_BUDGET:-}" ] || set -- "$@" --default-thinking-budget "$NINFER_DEFAULT_THINKING_BUDGET"
    exec /opt/ninfer/multi/ninfer-serve "$@"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ninfer-pvc
spec:
  storageClassName: "{{ kube_storageclass_ninfer }}"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "{{ ninfer_volume_size_gb }}Gi"

{% if ninfer_api_key | length > 0 %}
---
# not in the Deployment because it holds the API key; the ServiceMonitor reads it too
apiVersion: v1
kind: Secret
metadata:
  name: ninfer-api-key
data:
  api_key: "{{ ninfer_api_key | b64encode }}"
{% endif %}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninfer
spec:
  replicas: {{ ninfer_replicas }}
  # the GPU stays held until the old pod has finished terminating, so a RollingUpdate's new pod could
  # never schedule while the old one is still running ( same reasoning as ollama )
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ninfer-web
  template:
    metadata:
      labels:
        app: ninfer-web
    spec:
      nodeSelector:
        {{ ninfer_gpu_node_selector_key }}: "{{ ninfer_gpu_node_selector_value }}"
      runtimeClassName: "{{ ninfer_gpu_runtime_class_name }}"
      initContainers:
        # the release's own downloader: resumable, and it checks the size and SHA-256 of the file. It does nothing
        # but verify it when the model is already on the volume. ( A file that fails the check, such as the v2 file
        # an older ninfer-3090 release left here, is downloaded again. )
        - name: model
          image: "{{ ninfer_image }}"
          imagePullPolicy: IfNotPresent
          command: ["/opt/ninfer/download-model.sh", "{{ ninfer_profile }}"]
          env:
            - name: NINFER_MODEL_DIR
              value: /models
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /models
              name: models
      containers:
        - name: ninfer
          image: "{{ ninfer_image }}"
          imagePullPolicy: IfNotPresent
          # the image's ENTRYPOINT picks a build and runs run.sh; running run.sh directly ( the image only has the
          # multi-architecture build ) lets NINFER_SERVER below take effect, which the entrypoint's `run` would override
          command: ["/opt/ninfer/run.sh"]
          args: ["{{ ninfer_profile }}"]
          ports:
            - containerPort: 8080
          env:
            - name: NINFER_SERVER
              value: /opt/ninfer-wrapper/serve.sh
            - name: NINFER_MODEL_ID
              value: "{{ ninfer_served_model_name }}"
{% if ninfer_api_key | length > 0 %}
            - name: NINFER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ninfer-api-key
                  key: api_key
{% endif %}
{% if ninfer_spec | string | length > 0 %}
            - name: NINFER_SPEC
              value: "{{ ninfer_spec }}"
{% endif %}
{% if ninfer_context | string | length > 0 %}
            - name: NINFER_CONTEXT
              value: "{{ ninfer_context }}"
{% endif %}
{% if ninfer_concurrency | string | length > 0 %}
            - name: NINFER_CONCURRENCY
              value: "{{ ninfer_concurrency }}"
{% endif %}
{% if ninfer_draft_tokens | string | length > 0 %}
            - name: NINFER_DRAFT_TOKENS
              value: "{{ ninfer_draft_tokens }}"
{% endif %}
{% if ninfer_kv_dtype | string | length > 0 %}
            - name: NINFER_KV_DTYPE
              value: "{{ ninfer_kv_dtype }}"
{% endif %}
{% if ninfer_thinking_budget | string | length > 0 %}
            - name: NINFER_DEFAULT_THINKING_BUDGET
              value: "{{ ninfer_thinking_budget }}"
{% endif %}
{% for name, value in ninfer_env.items() %}
            - name: {{ name }}
              value: {{ value | string | to_json }}
{% endfor %}
          # /health is the one endpoint that needs no API key
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
          resources:
            limits:
              cpu: "{{ ninfer_cpu_limit }}"
              memory: "{{ ninfer_memory_limit }}"
              nvidia.com/gpu: "{{ ninfer_gpu_count }}"
            requests:
              cpu: "{{ ninfer_cpu_request }}"
              memory: "{{ ninfer_memory_request }}"
              nvidia.com/gpu: "{{ ninfer_gpu_count }}"
          volumeMounts:
            - mountPath: /models
              name: models
            - mountPath: /opt/ninfer-wrapper
              name: wrapper
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ninfer-pvc
        - name: wrapper
          configMap:
            name: ninfer-serve-wrapper
            defaultMode: 493  # 0755

---
apiVersion: v1
kind: Service
metadata:
  name: web
  # the ServiceMonitor selects on this label
  labels:
    app: ninfer-web
spec:
  selector:
    app: ninfer-web
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer
