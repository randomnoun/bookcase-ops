# k8s yaml based on docker config at https://docs.litellm.ai/docs/proxy/deploy

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-web
  template:
    metadata:
      labels:
        app: litellm-web
    spec:
      # ClusterFirst (the real k8s default) tries CoreDNS first for
      # everything - needed to resolve in-cluster service names like
      # web.dev-ollama.svc.cluster.local. CoreDNS's own Corefile forwards
      # anything outside cluster.local to the node's resolv.conf, so this
      # still resolves bnesql02.dev.randomnoun correctly too. A prior
      # dnsPolicy: Default (node's resolv.conf only, bypassing CoreDNS
      # entirely) fixed bnesql02 resolution but broke resolution of
      # in-cluster service names - this fixes both via one consistent path.
      dnsPolicy: ClusterFirst
      containers:
        - name: litellm
          # pinned (was main-stable, a moving tag) - a pod restart pulling a
          # newer image than the DB schema was migrated for is what caused
          # the "column does not exist" errors we hit. Bump deliberately,
          # and re-run the migration/push step when you do.
          image: ghcr.io/berriai/litellm-database:v1.104.0
          imagePullPolicy: IfNotPresent
          # the default 'prisma migrate' schema-sync path doesn't seem to
          # actually apply pending changes on this image (confirmed: it only
          # ever ran the read-only diff check, even though should_update_
          # prisma_schema() defaults to true) - force prisma db push instead,
          # which is safe here since litellm's own schema changes are
          # consistently additive (ADD COLUMN/CREATE TABLE/CREATE INDEX)
          args:
            - "--use_prisma_db_push"
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              # connect_timeout: DNS resolution for bnesql02 from inside this
              # pod is occasionally slow (not broken, just slow - a plain
              # python getaddrinfo() always succeeds, but prisma's own
              # resolver sometimes hits its default timeout first). Give it
              # more time to connect rather than fail with P1001.
              value: "postgresql://{{litellm_db_username}}:{{litellm_db_password}}@{{litellm_db_host}}:5432/{{litellm_db_schema}}?connect_timeout=30"
            - name: LITELLM_MASTER_KEY
              value: "{{litellm_master_key}}"
            - name: LITELLM_SALT_KEY
              value: "{{litellm_salt_key}}"
            # lets providers/models be managed from the Admin UI instead of a config.yaml
            - name: STORE_MODEL_IN_DB
              value: "True"
            # single replica, no redis - the per-worker rate-limit/budget
            # coordination redis provides doesn't apply here, so suppress
            # the startup warning about it
            - name: LITELLM_DISABLE_NO_REDIS_WARNING
              value: "true"
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 2Gi

---
# litellm docs use just a ClusterIP + ingress, I'll stick to LoadBalancer for consistency with the other apps here
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: litellm-web
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: LoadBalancer

---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: litellm-tls-secret
data:
  tls.crt: "{{ litellm_tls_secret_cert }}"
  tls.key: "{{ litellm_tls_secret_key }}"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-web-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
    - hosts:
        - {{ litellm_ingress_host }}
      secretName: litellm-tls-secret
  rules:
  - host: {{ litellm_ingress_host }}
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: "web"
            port:
              number: 4000
