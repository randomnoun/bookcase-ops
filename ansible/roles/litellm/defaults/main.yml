kube_context_litellm: ""
kube_namespace_litellm: "dev-litellm"

litellm_ingress_host: ""
litellm_ingress_class: ""
litellm_tls_secret_cert: ""
litellm_tls_secret_key: ""

litellm_db_host: ""
litellm_db_schema: ""
litellm_db_username: ""
litellm_db_password: ""

litellm_master_key: ""
litellm_salt_key: ""

# leave litellm_langfuse_host empty to disable sending traces to langfuse
litellm_langfuse_host: ""
litellm_langfuse_public_key: ""
litellm_langfuse_secret_key: ""

# Whether the prompts and responses are sent to langfuse, as well as the tokens, cost and timing. Empty = litellm's
# default, which is not to ( "no_content" ), so langfuse's Sessions and Tracing pages show no messages.
# "span_only" puts them on the trace, which is what langfuse reads. Other values litellm accepts are "event_only"
# and "span_and_event", but I don't think langfuse reads those. This stores every prompt and response in langfuse.
litellm_langfuse_capture_message_content: ""
