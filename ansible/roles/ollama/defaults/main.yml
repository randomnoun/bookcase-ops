kube_context_ollama: ""
kube_namespace_ollama: "dev-ollama"
kube_storageclass_ollama: ""

ollama_volume_size_gb: 1000

ollama_gpu_node_selector_key: "gpu-vendor"
ollama_gpu_node_selector_value: "nvidia"
ollama_gpu_count: 2
# must match the RuntimeClass name registered by the nvidia-device-plugin
# role (which in turn must match the containerd runtime name configured via
# `nvidia-ctk runtime configure --runtime=containerd` on the node)
ollama_gpu_runtime_class_name: "nvidia"

ollama_cpu_request: "4"
ollama_cpu_limit: "8"
ollama_memory_request: "32Gi"
ollama_memory_limit: "64Gi"

# ollama_context_length (server-wide default context window) is deliberately
# NOT defined here: it's a global var in host_vars/localhost.yml, shared with
# the pi and opencode roles. A copy here would override it (see apply_role.yml).
# Ollama otherwise auto-scales it from available VRAM (48GB+ -> up to 256K
# tokens), which is too large for a 70b model to fit alongside its weights.
# Individual requests (e.g. a per-model num_ctx from litellm) can still ask
# for more or less.

# computes attention in a memory-efficient way: faster long prompts, less
# memory as the context grows. Off by default in ollama, and the precondition
# for quantizing the KV cache. "1" = on, "0" = off.
ollama_flash_attention: "1"

# how long a model stays loaded in VRAM after its last request. Ollama's own
# default is 5m; after that the next request pays the full weight-loading cost.
# A duration ("30m", "24h"), seconds as a number, or "-1" to never unload.
ollama_keep_alive: "30m"
