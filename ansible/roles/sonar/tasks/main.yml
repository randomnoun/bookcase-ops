- name: "sonar_active_model must be one of sonar_models"
  assert:
    that: sonar_active_model in sonar_models
    fail_msg: "sonar_active_model '{{ sonar_active_model }}' is not in sonar_models ( {{ sonar_models.keys() | list }} )"
  when: sonar_active_model | length > 0

- name: "use the active sonar model"
  set_fact:
    sonar_model: "{{ _sonar_entry.model }}"
    sonar_model_revision: "{{ _sonar_entry.revision | default(sonar_model_revision) }}"
    sonar_quantization: "{{ _sonar_entry.quantization | default(sonar_quantization) }}"
    sonar_tokenizer: "{{ _sonar_entry.tokenizer | default(sonar_tokenizer) }}"
    sonar_max_model_len: "{{ _sonar_entry.max_model_len | default(sonar_max_model_len) }}"
    sonar_extra_args: "{{ _sonar_entry.extra_args | default(sonar_extra_args) }}"
  vars:
    _sonar_entry: "{{ sonar_models[sonar_active_model] }}"
  when: sonar_active_model | length > 0

- name: "sonar skipped, no sonar model is set"
  debug:
    msg: "set sonar_active_model in vars/sonar/<cluster>-models.vars.yml ( or sonar_model ) to deploy sonar"
  when: sonar_model | length == 0

- name: "kubernetes namespace sonar"
  k8s:
    state: "present"
    context: "{{ kube_context_sonar }}"
    wait: true
    definition: "{{ lookup('template', 'sonar-namespace.j2.yml')  }}"
  when: sonar_model | length > 0

- name: "look up current sonar replicas"
  k8s_info:
    context: "{{ kube_context_sonar }}"
    api_version: apps/v1
    kind: Deployment
    name: sonar
    namespace: "{{ kube_namespace_sonar }}"
  register: _sonar_existing
  when: sonar_model | length > 0

- name: "work out sonar replicas"
  set_fact:
    sonar_replicas: "{{ _sonar_existing.resources[0].spec.replicas if (_sonar_existing.resources | length > 0) else sonar_initial_replicas }}"
  when: sonar_model | length > 0

- name: "kubernetes deployment sonar"
  k8s:
    state: "present"
    context: "{{ kube_context_sonar }}"
    namespace: "{{ kube_namespace_sonar }}"
    # nothing to wait for when scaled to 0
    wait: "{{ sonar_replicas | int > 0 }}"
    # the model is downloaded on first start, which can take far longer than
    # the default 120s wait
    wait_timeout: 1800
    definition: "{{ lookup('template', 'sonar.j2.yml')  }}"
  when: sonar_model | length > 0

- name: "kubernetes servicemonitor sonar"
  k8s:
    state: "present"
    context: "{{ kube_context_sonar }}"
    namespace: "{{ kube_namespace_sonar }}"
    definition: "{{ lookup('template', 'sonar-servicemonitor.j2.yml')  }}"
  when: sonar_model | length > 0
