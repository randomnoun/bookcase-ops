kube_context_sonar: ""
kube_namespace_sonar: "dev-sonar"
kube_storageclass_sonar: ""

# Replica count the FIRST time the deployment is created. 0 because ollama, sonar and
# tabbyapi each want every GPU on the node, so only one can run at a time: start the one you
# want with `kubectl scale` (see setup/SETUP-LLM-BACKEND.md). After the first run the role keeps
# whatever the deployment is currently scaled to, so re-running it doesn't undo a `kubectl scale`.
sonar_initial_replicas: 0

sonar_volume_size_gb: 300

# Pinned: this is the last image published to Docker Hub (2025-11-08, upstream
# commit 5f1d2611, i.e. v0.10.0). It's the one that still contains both the
# exl2 and gguf loaders - upstream has since been renamed 'Sonar', its source
# tree no longer has an exl2 loader (only exl3) and no newer image is published.
# 'latest' currently points at the same digest.
sonar_image: "alpindale/aphrodite-openai:5f1d2611"

# Only needed if sonar_image comes from a registry that requires a login. Pulling from
# nexus3's docker-combined.nexus3.dev.randomnoun allows anonymous access, so leave these
# empty for that. When sonar_registry_username is set, a docker-registry pull secret is
# created and attached to the pod.
# (The node's containerd must also trust the registry's certificate - see setup/SETUP-LLM-BACKEND.md)
sonar_registry_host: ""
sonar_registry_username: ""
sonar_registry_password: ""

# Sonar (formerly Aphrodite Engine) serves exactly ONE model per process (unlike ollama, which swaps
# models in and out). To change model, edit these and re-run the role.
#
# sonar_model is a HuggingFace repo id, or a path under /root/.cache
# (the PVC mount) for a model you've copied in yourself. Examples:
#   EXL3:  turboderp/Qwen3.8-27B-exl3 (pick a quant with sonar_model_revision, e.g. "5.00bpw")
#   GGUF:  a path to a .gguf file, e.g. /root/.cache/gguf/Qwen3-Coder-30B-A3B-Q4_K_M.gguf
sonar_model: ""

# the name sonar serves the model under, and what goes in litellm's "LiteLLM Model Name".
# It doesn't need to change with the model: the model-specific name is litellm's "Model Name".
sonar_served_model_name: "local-sonar"

# HF branch/tag. EXL3 repos publish each bits-per-weight as its own
# branch (e.g. "5.00bpw"), so this is how you choose the quant. Empty = default branch.
sonar_model_revision: ""

# Leave empty: sonar works the format out from the model files ( EXL3 ) or the path ( a .gguf file ).
# Only set it to override that, e.g. "gguf".
# ( a self-built current Sonar image loads EXL3; the old pinned alpindale/aphrodite-openai image
#   above loads EXL2 instead, and needs this set to "exl2" )
sonar_quantization: ""

# a GGUF file carries no tokenizer sonar can use; point this at the HF repo
# of the original (unquantized) model. Not needed for EXL3.
sonar_tokenizer: ""

# optional HuggingFace token, for gated repos (e.g. meta-llama). Empty = none.
sonar_hf_token: ""

sonar_gpu_node_selector_key: "gpu-vendor"
sonar_gpu_node_selector_value: "nvidia"
# NB: ollama requests both GPUs on the node, so the two can't run at the same
# time at the default of 2. Scale ollama down first (see setup/SETUP-LLM-BACKEND.md),
# or set this to 1 here and the ollama gpu count to 1 there.
sonar_gpu_count: 2
# must match the RuntimeClass name registered by the nvidia-device-plugin role
sonar_gpu_runtime_class_name: "nvidia"

sonar_cpu_request: "4"
sonar_cpu_limit: "8"
sonar_memory_request: "16Gi"
sonar_memory_limit: "48Gi"

# unlike ollama's lazy default, sonar reserves the whole KV cache for this
# many tokens up front, so it directly determines how much VRAM is left for weights
sonar_max_model_len: "32768"

# fraction of each GPU's VRAM sonar may claim (weights + KV cache + activations)
sonar_gpu_memory_utilization: "0.90"

# shards the model across this many GPUs; normally equal to sonar_gpu_count
sonar_tensor_parallel_size: 2

# size of the in-memory /dev/shm, which the tensor-parallel workers use to talk to each other
sonar_shm_size: "8Gi"

# any further `aphrodite run` flags, one list item each, e.g.
#   - "--kv-cache-dtype=fp8"
#   - "--enforce-eager"
sonar_extra_args: []
