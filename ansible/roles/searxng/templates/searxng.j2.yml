# k8s yaml based on docker config at https://docs.searxng.org/admin/installation-docker.html
# no valkey/limiter and no persistent volume for now.
#
# settings.yml is supplied directly via ConfigMap (use_default_settings: true merges it over the
# image's built-in defaults) 
#
# json format is enabled (search.formats) so this can be used as an MCP/API search backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
data:
  settings.yml: |
    use_default_settings: true
    server:
      secret_key: "{{ searxng_secret_key }}"
      base_url: "https://{{ searxng_ingress_host }}/"
    search:
      formats:
        - html
        - json

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-web
  template:
    metadata:
      labels:
        app: searxng-web
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              name: searxng-config
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 512Mi
      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config

---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: searxng-web
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: searxng-tls-secret
data:
  tls.crt: "{{ searxng_tls_secret_cert }}"
  tls.key: "{{ searxng_tls_secret_key }}"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng-web-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
    - hosts:
        - {{ searxng_ingress_host }}
      secretName: searxng-tls-secret
  rules:
  - host: {{ searxng_ingress_host }}
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: "web"
            port:
              number: 8080
