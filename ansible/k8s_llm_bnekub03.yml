- hosts: localhost
  gather_facts: false
  vars:
    k8s_llm_bnekub03:
      deployments:
        - name: langfuse-bnekub03
          role: langfuse
          var_files: [bnekub03]
        - name: litellm-bnekub03
          role: litellm
          var_files: [bnekub03]
        - name: ollama-bnekub03
          role: ollama
          var_files: [bnekub03]
        # bnekub03-models: the model registry and active model, which bin/llm.py edits
        - name: sonar-bnekub03
          role: sonar
          var_files: [bnekub03, bnekub03-models]
        - name: tabbyapi-bnekub03
          role: tabbyapi
          var_files: [bnekub03, bnekub03-models]
        - name: open-webui-bnekub03
          role: open-webui
          var_files: [bnekub03]
        - name: pi-bnekub03
          role: pi
          var_files: [bnekub03]
        - name: opencode-bnekub03
          role: opencode
          var_files: [bnekub03]
        - name: openhands-bnekub03
          role: openhands
          var_files: [bnekub03]
        - name: searxng-bnekub03
          role: searxng
          var_files: [bnekub03]

  tasks:
    - name: deploy llm
      include_tasks: apply_role.yml
      vars:
        apply_role_name: "{{ _k8s_llm_bnekub03_deployment.0.role }}"
        apply_role_var_files: "{{ _k8s_llm_bnekub03_deployment.0.var_files }}"
      loop: "{{ k8s_llm_bnekub03.deployments | product(deployments.split(',')) | list }}"
      loop_control: { loop_var: _k8s_llm_bnekub03_deployment }
      when:
        - deployments is not defined or true
        - app is not defined or _k8s_llm_bnekub03_deployment.0.role == app or _k8s_llm_bnekub03_deployment.0.name == app

